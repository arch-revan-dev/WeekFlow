name: Android CI & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APKs for Artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WeekFlow-debug.apk
          cp app/build/outputs/apk/release/app-release.apk WeekFlow-release.apk

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-APKs
          path: |
            WeekFlow-debug.apk
            WeekFlow-release.apk
